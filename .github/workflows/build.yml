name: Build firmware

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build UF2 artifacts
    uses: ./.github/workflows/build-firmware.yml
    with:
      version: ${{ github.sha }}   # reusable build shortens a full SHA to 7
      # The macro branch targets the second Pico 2 W. Keep the other-board
      # release matrix on the clean upstream master branch.
      picow: false
      waveshare: false
      no_batt_led_check: false
